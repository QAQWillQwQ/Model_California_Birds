seed: 42

# ConvNeXt V2 Base — FCMAE + IN-22K + IN-1K pretrained
# Strong fine-grained features from masked autoencoder pretraining
model: convnextv2_base
pretrained: true

data_root: /mnt/c/Users/ljh20/MCS/CS273P/Model_California_Birds/data/CUB_200_2011/images

# Phase 1: low resolution warm start for fast initial representation
image_size: 224
batch_size: 32

epochs: 15
learning_rate: 0.0001

val_split: 0.15
num_workers: 4
use_amp: true
freeze_backbone: false
val_interval: 1
prefetch_factor: 4
cudnn_benchmark: true
float32_matmul_precision: high
archive_outputs: false
clear_logs_before_run: true

# Use CUB-200-2011 official train/test split (5994 train / 5794 test)
use_official_split: true

# Regularization — moderate for warm start
weight_decay: 0.05
label_smoothing: 0.1
dropout_rate: 0.2
mixup_alpha: 0.2
cutmix_alpha: 1.0

# Cosine schedule with short warmup
scheduler: cosine
warmup_epochs: 2

# No early stopping for short warm start
early_stopping_patience: 0

log_interval: 30

output_dir: /mnt/c/Users/ljh20/MCS/CS273P/Model_California_Birds/outputs
