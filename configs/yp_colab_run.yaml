seed: 42

model: eva02_base_patch14_448.mim_in22k_ft_in1k
pretrained: true

data_root: /root/.cache/kagglehub/datasets/anamethatiscreative/southern-california-birds/versions/5/data
#data_root: /kaggle/input/southern-california-birds/data
image_size: 448
batch_size: 32

epochs: 400
learning_rate: 2.0e-05

val_split: 0.15
num_workers: 8
use_amp: true
freeze_backbone: false
val_interval: 1
prefetch_factor: 4
compile_model: true
cudnn_benchmark: true
float32_matmul_precision: high
clear_logs_before_run: true

weight_decay: 0.05
label_smoothing: 0.1
dropout_rate: 0.1
mixup_alpha: 0.1
cutmix_alpha: 0.5

scheduler: cosine
warmup_epochs: 2

layerwise_lr:
  enabled: true
  decay: 0.75

early_stopping_patience: 50

log_interval: 50

output_dir: /content/drive/MyDrive/ML_outputs

