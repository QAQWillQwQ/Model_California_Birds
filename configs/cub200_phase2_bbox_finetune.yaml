use_bbox_crop: true
bbox_pad_fraction: 0.1

# Resume from bbox scratch run best checkpoint
resume_from: /mnt/c/Users/ljh20/MCS/CS273P/Model_California_Birds/outputs/output_20260314_103651/checkpoints/convnextv2_base_best_full.pth

