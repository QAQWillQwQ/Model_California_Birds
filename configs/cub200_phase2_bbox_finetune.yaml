seed: 42

# ConvNeXt V2 Base -- Phase 2 bbox finetune: resume from bbox scratch run with lower LR
model: convnextv2_base
pretrained: true

data_root: /mnt/c/Users/ljh20/MCS/CS273P/Model_California_Birds/data/CUB_200_2011/images

image_size: 384
batch_size: 12

epochs: 35
learning_rate: 0.000005

val_split: 0.15
num_workers: 4
use_amp: true
freeze_backbone: false
val_interval: 1
prefetch_factor: 4
cudnn_benchmark: true
float32_matmul_precision: high
archive_outputs: false
clear_logs_before_run: true

# Use CUB-200-2011 official train/test split
use_official_split: true

# Regularization -- same as bbox scratch run
weight_decay: 0.05
label_smoothing: 0.1
dropout_rate: 0.15
