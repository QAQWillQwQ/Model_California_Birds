seed: 42

# ConvNeXt V2 Base -- Phase 2 reduced augmentation: test if MixUp/CutMix is suppressing accuracy
model: convnextv2_base
pretrained: true

data_root: /mnt/c/Users/ljh20/MCS/CS273P/Model_California_Birds/data/CUB_200_2011/images

image_size: 384
batch_size: 12

epochs: 25
learning_rate: 0.000005

val_split: 0.15
num_workers: 4
use_amp: true
freeze_backbone: false
val_interval: 1
prefetch_factor: 4
cudnn_benchmark: true
float32_matmul_precision: high
archive_outputs: false
clear_logs_before_run: true

# Use CUB-200-2011 official train/test split
use_official_split: true

# Regularization -- reduced MixUp/CutMix, keep other regularization same as baseline
weight_decay: 0.05
label_smoothing: 0.1
dropout_rate: 0.15
mixup_alpha: 0.0
cutmix_alpha: 0.0

# Cosine schedule with warmup
scheduler: cosine
warmup_epochs: 1

# Early stopping
early_stopping_patience: 7

# No novel components -- standard CE
use_attribute_smoothing: false
use_part_masking: false
use_confusion_sampling: false

# Resume from Phase 1 best checkpoint -- same starting point as baseline
resume_from: /mnt/c/Users/ljh20/MCS/CS273P/Model_California_Birds/outputs/output_20260314_031959/checkpoints/convnextv2_base_best_full.pth

log_interval: 30

output_dir: /mnt/c/Users/ljh20/MCS/CS273P/Model_California_Birds/outputs
