seed: 42

model: vit_base
pretrained: true

data_root: /media/blue-lobster/p2/UCI/CS273p/birds_of_california/data

image_size: 224
batch_size: 64

# Tuned from output_20260308_165045:
# - lower peak LR to reduce the noisy early ramp
# - slightly lighter regularization to raise the validation ceiling
# - a few more epochs to give the lower-LR schedule room to work
epochs: 72
learning_rate: 0.0007

val_split: 0.15

num_workers: 4
use_amp: true
freeze_backbone: false
val_interval: 1
prefetch_factor: 4
compile_model: false
cudnn_benchmark: true
float32_matmul_precision: high
clear_logs_before_run: true

# regularization
weight_decay: 0.01
label_smoothing: 0.05
dropout_rate: 0.2
mixup_alpha: 0.2
cutmix_alpha: 0.5

# scheduler
scheduler: onecycle

# early stopping (0 = disabled)
early_stopping_patience: 12

log_interval: 50

output_dir: /home/blue-lobster/PycharmProjects/Model_California_Birds/outputs
