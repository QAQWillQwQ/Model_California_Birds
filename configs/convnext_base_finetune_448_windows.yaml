seed: 42

model: convnext_base.fb_in22k_ft_in1k
pretrained: true

data_root: C:\Users\ljh20\MCS\CS273P\Model_California_Birds\data

# Phase 2: higher resolution fine-tuning from v5 best checkpoint
image_size: 448
batch_size: 16

epochs: 80
learning_rate: 0.0001

val_split: 0.15
num_workers: 4
use_amp: true
freeze_backbone: false
val_interval: 1
prefetch_factor: 4
compile_model: false
cudnn_benchmark: true
float32_matmul_precision: high
archive_outputs: true
clear_logs_before_run: true

# regularization (lighter than v5 — model is already well-trained)
weight_decay: 0.05
label_smoothing: 0.1
dropout_rate: 0.2
mixup_alpha: 0.2
cutmix_alpha: 1.0

# scheduler — cosine with warmup to gently ramp into new resolution
scheduler: cosine
warmup_epochs: 3

# early stopping
early_stopping_patience: 10

# resume from v5 best full checkpoint — UPDATE THIS PATH after v5 finishes
# resume_from: C:\Users\ljh20\MCS\CS273P\Model_California_Birds\outputs\output_XXXXXXXX_XXXXXX\checkpoints\convnext_base.fb_in22k_ft_in1k_best.pth

log_interval: 50

output_dir: C:\Users\ljh20\MCS\CS273P\Model_California_Birds\outputs
