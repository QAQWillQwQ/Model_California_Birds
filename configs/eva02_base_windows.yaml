seed: 42

# Phase 3: Domain-rich pretraining — EVA-02 Base (IN-22K pretrained, native 448px)
# EVA-02 uses masked image modeling (MIM) pretraining on IN-22K then fine-tuned on IN-1K
# Much richer features than ConvNeXt IN-22K for fine-grained classification
model: eva02_base_patch14_448.mim_in22k_ft_in1k
pretrained: true

data_root: C:\Users\ljh20\MCS\CS273P\Model_California_Birds\data

image_size: 448
batch_size: 16

epochs: 40
learning_rate: 0.00005

val_split: 0.15
num_workers: 4
use_amp: true
freeze_backbone: false
val_interval: 1
prefetch_factor: 4
compile_model: false
cudnn_benchmark: true
float32_matmul_precision: high
archive_outputs: true
clear_logs_before_run: true

# regularization — ViT-based models need strong regularization
weight_decay: 0.05
label_smoothing: 0.1
dropout_rate: 0.2
mixup_alpha: 0.2
cutmix_alpha: 1.0

# scheduler — cosine with warmup for transformer stability
scheduler: cosine
warmup_epochs: 3

# early stopping
early_stopping_patience: 10

log_interval: 50

output_dir: C:\Users\ljh20\MCS\CS273P\Model_California_Birds\outputs
