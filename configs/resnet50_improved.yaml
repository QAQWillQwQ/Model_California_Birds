seed: 42

model: resnet50
pretrained: true

data_root: /Users/jihangli/MCS/CS273P/Model_California_Birds/data

image_size: 224
batch_size: 32

epochs: 30
learning_rate: 0.0003

val_split: 0.15
num_workers: 4
use_amp: true
freeze_backbone: false
val_interval: 1
prefetch_factor: 4
compile_model: false
cudnn_benchmark: true
float32_matmul_precision: high
archive_outputs: true
clear_logs_before_run: true

# regularization
weight_decay: 0.01
label_smoothing: 0.1
dropout_rate: 0.3

# early stopping (0 = disabled)
early_stopping_patience: 8

log_interval: 50

output_dir: /Users/jihangli/MCS/CS273P/Model_California_Birds/outputs
